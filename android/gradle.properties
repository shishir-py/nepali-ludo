# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Required by audioplayers, file_picker and every modern Flutter plugin.
# Keep these here rather than patching them in from a workflow step, so that
# CI, the Release workflow and local builds all behave the same way.
