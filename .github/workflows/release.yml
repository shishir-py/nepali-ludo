name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "Ludo-Pro-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ludo Pro ${{ github.ref_name }}"
          body: |
            ## Ludo Pro ${{ github.ref_name }} 🎲

            ### Features
            - 🎲 Classic Ludo with realistic 3D dice
            - 🤖 Computer opponent (Easy / Normal / Hard)
            - 👥 2–4 players on one device, each picks a colour
            - 🏔️ Himalayan-themed board
            - 🔊 Sound effects and music, customisable per event
            - 🏆 Statistics and achievements
            - 💾 Save and resume, works offline

            ### Install
            1. Download the APK below
            2. Open it on your Android phone
            3. Allow installing from unknown sources if asked
            4. If an older version is installed, uninstall it first
          files: "Ludo-Pro-*.apk"
          draft: false
          # beta / alpha / rc tags become pre-releases automatically
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
