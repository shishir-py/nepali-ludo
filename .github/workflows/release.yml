name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-release.apk \
             "Nepali-Ludo-${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "नेपाली लुडो ${{ github.ref_name }}"
          body: |
            ## नेपाली लुडो ${{ github.ref_name }} 🎲

            **नयाँ संस्करण प्रकाशित भयो!**

            ### विशेषताहरू
            - 🎲 क्लासिक लुडो खेल
            - 🤖 AI प्रतिद्वन्द्वी (सजिलो / सामान्य / गाह्रो)
            - 👥 स्थानीय बहु-खेलाडी
            - 🇳🇵 नेपाली भाषामा सम्पूर्ण UI
            - 😂 नेपाली प्रतिक्रियाहरू
            - 🔊 आवाज प्रभावहरू (कस्टम आवाज छान्न सकिने)
            - 🏆 तथ्याङ्क र उपलब्धिहरू
            - 💾 खेल बचत/पुनः सुरु
            - 📱 अफलाइन समर्थन

            ### APK डाउनलोड गर्नुहोस्
            तलको APK फाइल डाउनलोड गरेर आफ्नो Android फोनमा स्थापना गर्नुहोस्।

            > **ध्यान दिनुहोस्:** "Unknown sources" बाट स्थापना अनुमति दिनु पर्न सक्छ।
          files: "Nepali-Ludo-*.apk"
          draft: false
          # beta / alpha / rc tags become pre-releases automatically
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
