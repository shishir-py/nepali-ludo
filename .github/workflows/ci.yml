name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting (warning only)
        run: dart format --output=none --set-exit-if-changed lib/ test/
        continue-on-error: true
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Regenerate Android scaffolding
        # Fills in missing gradle wrapper jar, icons, gradle.properties, etc.
        # It will overwrite android/app/build.gradle — we fix that in the next step.
        run: flutter create --platforms=android --org=com.nepali --project-name=nepali_ludo .

      - name: Patch regenerated build.gradle (fix flutter.versionCode)
        # Newer flutter create in some templates still emits the older
        # `flutter.versionCode` syntax that the Flutter Gradle plugin no
        # longer exposes. Replace those two lines with hardcoded values.
        run: |
          set -e
          BG=android/app/build.gradle
          echo "--- BEFORE ---" && sed -n '20,40p' "$BG"
          sed -i 's|versionCode = flutter.versionCode|versionCode = 1|' "$BG"
          sed -i 's|versionName = flutter.versionName|versionName = "1.0.0"|' "$BG"
          # Also make sure minSdk is high enough for file_picker
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 21|' "$BG"
          echo "--- AFTER ---" && sed -n '20,40p' "$BG"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nepali-ludo-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
