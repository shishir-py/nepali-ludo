name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting (warning only)
        run: dart format --output=none --set-exit-if-changed lib/ test/
        continue-on-error: true
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Regenerate Android scaffolding
        # Fills in missing gradle wrapper jar, icons, gradle.properties, etc.
        # It will overwrite android/app/build.gradle — we fix that in the next step.
        run: flutter create --platforms=android --org=com.nepali --project-name=nepali_ludo .

      - name: Patch regenerated build.gradle (fix flutter.versionCode)
        run: |
          set -e
          BG=android/app/build.gradle
          sed -i 's|versionCode = flutter.versionCode|versionCode = 1|' "$BG"
          sed -i 's|versionName = flutter.versionName|versionName = "1.0.0"|' "$BG"
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 21|' "$BG"
          sed -i 's|compileSdk = flutter.compileSdkVersion|compileSdk = 35|' "$BG"
          sed -i 's|targetSdk = flutter.targetSdkVersion|targetSdk = 35|' "$BG"

      - name: Ensure AndroidX is enabled in gradle.properties
        # Required by audioplayers, file_picker and every modern Flutter plugin.
        run: |
          set -e
          GP=android/gradle.properties
          touch "$GP"
          grep -q "^android.useAndroidX=" "$GP" || echo "android.useAndroidX=true" >> "$GP"
          grep -q "^android.enableJetifier=" "$GP" || echo "android.enableJetifier=true" >> "$GP"
          grep -q "^org.gradle.jvmargs=" "$GP" || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError" >> "$GP"
          echo "--- gradle.properties ---" && cat "$GP"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nepali-ludo-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
